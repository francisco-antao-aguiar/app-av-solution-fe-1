<div class="relative w-full max-w-md overflow-hidden rounded-xl shadow-lg">
  <!-- Image -->
  <img
    alt="{{ data.title }}"
    class="h-64 w-full object-cover"
    src="{{ data.image }}"
  />

  <!-- Gradient overlay -->
  <div class="absolute inset-0 bg-linear-to-t from-black/70 via-black/30 to-transparent"></div>

  <!-- Content -->
  <div class="absolute bottom-0 left-0 right-0 p-4 text-white">
    <h3 class="text-lg font-semibold leading-tight">
      {{ data.title }}
    </h3>

    <div class="mt-1 text-sm text-white/90">
      {{ data.subtitle }}
    </div>

    <div class="mt-2 flex items-center gap-1 text-sm text-white/80">
      <i class="fa-solid fa-location-dot"></i>
      <span>{{ data.location }} | {{ data.year }}</span>
    </div>
  </div>
</div>
