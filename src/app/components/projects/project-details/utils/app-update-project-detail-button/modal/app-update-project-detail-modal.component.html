<div class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-lg rounded-2xl p-6 relative shadow-xl">

    <!-- Close -->
    <button
      (click)="close.emit()"
      class="absolute top-4 right-4 text-gray-400 hover:text-black"
      type="button">
      ✕
    </button>

    <h2 class="text-lg font-semibold mb-6">Edit Project</h2>

    <form [formGroup]="form" class="space-y-4">

      <!-- Title -->
      <div class="relative">
        <input
          class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm"
          formControlName="title"
          placeholder=" "
          type="text"/>
        <label class="floating-label">Title</label>
      </div>

      <!-- Subtitle -->
      <div class="relative">
        <input
          class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm"
          formControlName="subtitle"
          placeholder=" "
          type="text"/>
        <label class="floating-label">Subtitle</label>
      </div>

      <!-- Description -->
      <div class="relative">
        <textarea
          class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm resize-none"
          formControlName="description"
          placeholder=" "
          rows="4">
        </textarea>
        <label class="floating-label">Description</label>
      </div>

      <!-- Location -->
      <div class="relative">
        <input
          class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm"
          formControlName="location"
          placeholder=" "
          type="text"/>
        <label class="floating-label">Location</label>
      </div>

      <!-- Year -->
      <div class="relative">
        <input
          class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm"
          formControlName="year"
          placeholder=" "
          type="number"/>
        <label class="floating-label">Year</label>
      </div>

      <div class="flex gap-3">
        <!-- Duration -->
        <div class="relative flex-1">
          <input
            class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm"
            formControlName="duration"
            placeholder=" "
            type="number"/>
          <label class="floating-label">Duration</label>
        </div>

        <!-- Unit -->
        <div class="relative w-32">
          <select
            class="peer w-full border rounded-lg px-3 pt-5 pb-2 text-sm bg-white"
            formControlName="durationUnit">
            <option disabled value=""></option>
            <option value="anos">anos</option>
            <option value="meses">meses</option>
            <option value="dias">dias</option>
          </select>
          <label class="floating-label select-label">Unit</label>
        </div>
      </div>

      <!-- Images -->
      <input
        (change)="onFileSelect($event)"
        accept="image/*"
        class="w-full text-sm"
        multiple
        type="file"/>

      <!-- Image previews -->
      <div class="flex flex-wrap gap-3 mt-3">
        <div
          *ngFor="let img of images; let i = index"
          class="relative w-20 h-20 border rounded overflow-hidden">

          <img
            [src]="img.url"
            alt=""
            class="w-full h-full object-cover"/>

          <button
            (click)="removeImage(i)"
            class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-5 h-5 text-xs"
            type="button">
            ✕
          </button>
        </div>
      </div>
      <!-- Submit -->
      <button
        class="w-full mt-4 py-2 rounded-lg text-white disabled:opacity-50"
        (click)="submit()"
        style="background-color: var(--primary-color);"
        type="button">
        Save Project
      </button>

    </form>
  </div>
</div>
