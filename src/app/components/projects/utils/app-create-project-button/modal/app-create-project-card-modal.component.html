<!-- Backdrop -->
<div class="fixed inset-0 bg-black/50 z-50 overflow-y-auto">

  <!-- Modal -->
  <div class="bg-white w-full max-w-lg rounded-xl p-6 relative mx-auto my-8 sm:my-16">

    <!-- Close -->
    <button
      (click)="close.emit()"
      class="absolute top-3 right-3 text-gray-500 hover:text-black">
      ✕
    </button>

    <h2 class="text-xl font-semibold mb-4">Add New Project</h2>

    <form [formGroup]="form" class="space-y-3">

      <input
        class="w-full border rounded px-3 py-2"
        formControlName="title"
        placeholder="Title"
        type="text"/>

      <input
        class="w-full border rounded px-3 py-2"
        formControlName="subtitle"
        placeholder="Subtitle"
        type="text"/>

      <textarea
        class="w-full h-50 border rounded px-3 py-2"
        formControlName="description"
        placeholder="Description"
        rows="4">
      </textarea>

      <!-- Location -->
      <input
        class="w-full border rounded px-3 py-2"
        formControlName="location"
        placeholder="Location"
        type="text"/>

      <!-- Year -->
      <input
        class="w-full border rounded px-3 py-2 no-spinner"
        formControlName="year"
        placeholder="Year"
        type="number"/>

      <!-- Total Area -->
      <input
        class="w-full border rounded px-3 py-2"
        formControlName="totalArea"
        placeholder="Total Area (m²)"
        type="number"/>

      <!-- Duration + Unit -->
      <div class="flex gap-3">
        <input
          class="w-full border rounded px-3 py-2"
          formControlName="duration"
          placeholder="Duration"
          type="number"/>

        <select
          class="w-40 border rounded px-3 py-2 bg-white"
          formControlName="durationUnit">
          <option disabled value="">Select</option>
          <option value="anos">anos</option>
          <option value="meses">meses</option>
          <option value="dias">dias</option>
        </select>
      </div>


      <!-- Image upload -->
      <input
        (change)="onFileSelect($event)"
        accept="image/*"
        class="w-full"
        multiple
        type="file"/>

      <!-- Image previews -->
      <div class="flex flex-wrap gap-3 mt-3">
        <div
          *ngFor="let img of images; let i = index"
          class="relative w-20 h-20 border rounded overflow-hidden">

          <img
            [src]="img.url"
            alt=""
            class="w-full h-full object-cover"/>

          <button
            (click)="removeImage(i)"
            class="absolute top-1 right-1 bg-black/60 text-white rounded-full w-5 h-5 text-xs"
            type="button">
            ✕
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button
        (click)="submit()"
        [disabled]="form.invalid"
        class="w-full mt-4 py-2 rounded text-white disabled:opacity-50"
        style="background-color: var(--primary-color);"
        type="button">
        Save Project
      </button>

    </form>
  </div>
</div>
