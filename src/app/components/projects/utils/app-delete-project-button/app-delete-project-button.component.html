<div
  (click)="openConfirm()"
  class="group w-12 h-12 rounded-full bg-red-500 flex items-center justify-center hover:bg-red-600 transition-colors cursor-pointer z-50"
>
  <i
    class="fa-solid fa-xmark fa-2x text-white
           hover:scale-110 transition-transform"
  ></i>
</div>

<!-- Backdrop -->
<div
  (click)="closeConfirm()"
  *ngIf="showConfirm" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50"
>
  <!-- Modal -->
  <div (click)="$event.stopPropagation()" class="bg-white rounded-xl shadow-lg w-80 p-6">
    <h2 class="text-lg font-semibold mb-2 text-gray-800">
      Confirm delete
    </h2>

    <p class="text-sm text-gray-600 mb-6">
      Are you sure you want to delete this item? This action cannot be undone.
    </p>

    <div class="flex justify-end gap-3">
      <button
        (click)="closeConfirm()"
        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 transition"
      >
        Cancel
      </button>

      <button
        (click)="confirmDelete($event)"
        class="px-4 py-2 rounded-lg bg-red-500 text-white hover:bg-red-600 transition"
      >
        Delete
      </button>
    </div>
  </div>
</div>
