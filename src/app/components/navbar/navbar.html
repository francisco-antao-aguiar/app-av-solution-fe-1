<nav class="navbar-bg navbar-text">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <img src="assets/logo.png" alt="Logo" class="h-8 w-auto">
      </div>

      <!-- Navigation Links -->
      <div class="hidden md:block">
        <div class="ml-10 flex items-baseline space-x-8">
          <a routerLink="/home" routerLinkActive="active-underline" class="px-3 py-2 text-sm font-medium hover-bg transition-colors">Home</a>
          <a routerLink="/portfolio" routerLinkActive="active-underline" class="px-3 py-2 text-sm font-medium hover-bg transition-colors">Portfolio</a>
          <a routerLink="/about-us" routerLinkActive="active-underline" class="px-3 py-2 text-sm font-medium hover-bg transition-colors">About Us</a>
          @if (authService.isLoggedIn()) {
            <a routerLink="/test" routerLinkActive="active-underline" class="px-3 py-2 text-sm font-medium hover-bg transition-colors">Test Admin</a>
          }
        </div>
      </div>

        <!-- User Info and Logout -->
        @if (authService.isLoggedIn()) {
            <div class="hidden md:block flex items-center space-x-4">
                <span class="text-sm opacity-80">Welcome, {{ authService.getUsername() }}</span>
                <button (click)="logout()" class="logout-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm">Logout</button>
            </div>   
        }

        <!-- Mobile menu button -->
        <div class="md:hidden">
            <button (click)="toggleMobileMenu()" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover-bg focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-500">
                <span class="sr-only">Open main menu</span>
                <!-- Hamburger icon -->
                <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
         
    </div>

    <!-- Mobile menu (expands navbar downward) -->
    <div class="md:hidden border-t border-gray-200 bg-white overflow-hidden transition-all duration-300 ease-in-out"
         [class.max-h-0]="!isMobileMenuOpen()"
         [class.max-h-96]="isMobileMenuOpen()"
         [class.opacity-0]="!isMobileMenuOpen()"
         [class.opacity-100]="isMobileMenuOpen()">
      <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
        <a (click)="closeMobileMenu()" routerLink="/home" routerLinkActive="active-underline" class="block px-3 py-3 text-base font-medium hover-bg rounded-md transition-all duration-200">Home</a>
        <a (click)="closeMobileMenu()" routerLink="/portfolio" routerLinkActive="active-underline" class="block px-3 py-3 text-base font-medium hover-bg rounded-md transition-all duration-200">Portfolio</a>
        <a (click)="closeMobileMenu()" routerLink="/about-us" routerLinkActive="active-underline" class="block px-3 py-3 text-base font-medium hover-bg rounded-md transition-all duration-200">About Us</a>
        @if (authService.isLoggedIn()) {
          <a (click)="closeMobileMenu()" routerLink="/test" routerLinkActive="active-underline" class="block px-3 py-3 text-base font-medium hover-bg rounded-md transition-all duration-200">Test Admin</a>
        }
        @if (authService.isLoggedIn()) {
          <div class="px-3 py-3 border-t border-gray-200 mt-3">
            <span class="block text-sm text-gray-600 mb-2">Welcome, {{ authService.getUsername() }}</span>
            <button (click)="logout()" class="logout-btn w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-all duration-200">Logout</button>
          </div>
        }
      </div>
    </div>
  </div>

</nav>
