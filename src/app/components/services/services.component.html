<section class="py-4 services pt-10" id="services">
  @if(authService.isLoggedIn()) {
    <section class="relative py-4 services pt-10" id="services" >
        <div class="absolute top-0 right-0 size-16 pointer-events-auto">
          <app-update-project-button (labelsUpdatedEvent)="updateLabels($event)" [input]="data" [pageId]="pageId"></app-update-project-button>
        </div>
    </section>
  }
  <div class="max-w-7xl mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold text-secondary mb-4">{{ data.title }}</h2>
      <div class="w-24 h-1 bg-primary mx-auto mb-6"></div>
      <p class="text-lg text-gray-600">{{ data.subtitle }}</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
      @for (card of data.cards; track card.id) {
        <div class="card text-center">
          <div class="card-icon">
            <i class="fas {{card.icon}}"></i>
          </div>
          <h3 class="text-xl font-bold text-secondary mb-3">{{ card.title }}</h3>
          <p class="text-gray-600">{{ card.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
