<section class="about w-full flex justify-center items-center" id="about-us">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">

      <!-- LEFT SIDE -->
      <div class="relative">
        <img
          alt="About us"
          class="w-full h-full object-cover rounded-2xl shadow-2xl"
          src="{{ data.image }}"
          style="filter: drop-shadow(0 0 1rem var(--dark-shadow))"
        />

        <!-- Experience Badge -->
        <div
          class="absolute -bottom-4 -right-4 text-white rounded-xl shadow-lg text-center
         px-3 py-4 md:px-6 md:py-8
         text-xl md:text-4xl"
          style="background: var(--primary-color)"
        >
          <div class="font-bold pb-1">{{ data.badgeTitle }}</div>
          <div class="font-medium text-sm md:text-base">{{ data.badgeSubtitle }}</div>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div>
        <h2 class="text-4xl md:text-5xl font-bold mb-12">
          {{ data.title }}
        </h2>

        <p class="text-lg text-gray-800 leading-relaxed mb-8">
          {{ data.description }}
        </p>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
          @for (characteristic of data.characteristics; track characteristic.id) {
            <!-- FEATURES -->
            <div class="flex items-center gap-3">
              <i class="fa-solid fa-circle-check text-lg" style="color: var(--primary-color)"></i>
              <span class="text-gray-900">{{ characteristic.text }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
