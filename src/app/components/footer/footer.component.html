<footer class="footer">
  @if(authService.isLoggedIn()) {
    <section class="relative py-4 services pt-10" id="services" >
        <div class="absolute top-0 right-0 size-16 pointer-events-auto">
          <app-update-project-button (labelsUpdatedEvent)="updateLabels($event)" [input]="data" [pageId]="pageId"></app-update-project-button>
        </div>
    </section>
  }
  <div class="max-w-7xl mx-auto px-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
      <div class="flex flex-col items-center">
          <img src="assets/logo.png" alt="Grupo Mirandas" class="logo-img mb-4 brightness-0 invert">
        <p class="text-gray-400">{{ data.subtitle }}</p>
      </div>

        <div class="flex flex-col items-center">
          <h3 class="text-xl font-bold mb-4">Contactos</h3>
          <p class="mb-2">
          <i class="fas fa-phone mr-2 text-primary icon"></i>
          {{ data.telephone }}
          </p>
          <p class="mb-2">
          <i class="fas fa-envelope mr-2 text-primary icon"></i>
            {{ data.email }}
          </p>
          <p>
          <i class="fas fa-map-marker-alt mr-2 text-primary icon"></i>
          {{ data.location }}
          </p>
      </div>

        <div class="flex flex-col items-center">
          <h3 class="text-xl font-bold mb-4">Siga-nos</h3>
          <div class="flex gap-4 justify-center">
          <a href="https://www.linkedin.com/company/grupo-mirandas" class="footer-link text-2xl">
              <i class="fab fa-facebook"></i>
          </a>
          <a href="https://www.linkedin.com/company/grupo-mirandas" class="footer-link text-2xl">
              <i class="fab fa-instagram"></i>
          </a>
          <a href="https://www.linkedin.com/company/grupo-mirandas" class="footer-link text-2xl">
              <i class="fab fa-linkedin"></i>
          </a>
          </div>
      </div>
      </div>

    <div class="border-t border-gray-700 pt-6 text-center text-gray-400">
      <p>&copy; 2026 Grupo Mirandas. Todos os direitos reservados.</p>
      </div>
  </div>
</footer>
