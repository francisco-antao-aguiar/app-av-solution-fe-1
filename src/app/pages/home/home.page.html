@if (hasLabels() && !isLoading()) {
  <home-banner-component [data]="homeData()!.homeBanner"></home-banner-component>
  <about-us-component [data]="homeData()!.aboutUs"></about-us-component>
  <fade-light-to-dark-component></fade-light-to-dark-component>
  <services-component [data]="homeData()!.services"></services-component>
  <fade-dark-to-light-component></fade-dark-to-light-component>
  @if (isLoading()) {
    <div>
    </div>
  } @else if (error()) {
    <div>
      Error.
    </div>
  } @else if (response()) {
    <projects-preview-component [data]="response()!"></projects-preview-component>
  } @else {
    <div>No project found.</div>
  }
  <clients-component [clients]="clients()!" [displayType]="'banner'"></clients-component>
  <fade-light-to-dark-component [endColor]="'var(--primary-color)'"></fade-light-to-dark-component>
  <!--TODO: remove this at the end
  <contact-us-component [data]="homeData()!.contactUs"></contact-us-component>-->
  <footer-component [data]="homeData()!.contacts"></footer-component>
}
